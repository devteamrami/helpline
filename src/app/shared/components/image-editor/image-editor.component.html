<div class="ie-overlay" dir="ltr">
  <div class="ie-panel">

    <!-- Header -->
    <div class="ie-header">
      <div class="ie-header-left">
        <div class="ie-header-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </div>
        <div class="ie-header-text">
          <h3>{{ title }}</h3>
          <p>{{ subtitle }}</p>
        </div>
      </div>
      <button class="ie-close" type="button" (click)="onCancel()" [disabled]="saving" title="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Editor mount -->
    <div class="ie-body">
      @if (isLoading) {
        <div class="ie-loading">
          <div class="ie-spinner"></div>
          <span>Loading image editor…</span>
        </div>
      }
      <div #editorMount class="ie-mount"></div>
    </div>

    <!-- Error -->
    @if (errorMessage) {
      <div class="ie-error">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <!-- Footer actions -->
    <div class="ie-footer">
      <button class="ie-btn ie-btn-secondary" type="button" (click)="onCancel()" [disabled]="saving">
        Discard Changes
      </button>
      <button class="ie-btn ie-btn-primary" type="button" (click)="onApply()" [disabled]="saving || isLoading">
        @if (saving) {
          <span class="ie-btn-spinner"></span>
          <span>Saving…</span>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Apply &amp; Insert</span>
        }
      </button>
    </div>

  </div>
</div>
